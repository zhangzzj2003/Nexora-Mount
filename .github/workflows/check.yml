name: 桌面检查

# 分支推送和 PR 执行检查；手动运行也可生成测试安装包。标签发布单独管理。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# CI 只读取源码，安装包保存到 Actions，不自动发布 Release。
permissions:
  contents: read

# 同一分支或 PR 的新提交到达后，取消尚未完成的旧检查。
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 检查与构建 (${{ matrix.platform }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            package-args: --mac dmg --arm64 --x64
          - os: windows-latest
            platform: Windows
            package-args: --win nsis --x64
    runs-on: ${{ matrix.os }}
    env:
      # 缺少正式证书时生成未签名测试包，不依赖开发者机器上的签名身份。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 安装 pnpm（版本读取 package.json）
        uses: pnpm/action-setup@v6
      - name: 安装 Node.js 与依赖缓存
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile
      - name: 检查代码格式
        run: pnpm format:check
      - name: 检查 TypeScript 类型
        run: pnpm typecheck
      - name: 运行业务与本机原生接口测试
        run: pnpm test
      - name: 构建应用并运行 Electron 桌面测试
        run: pnpm test:e2e
      - name: 验证目录包构建
        run: pnpm exec electron-builder --dir --publish never

      # PR 与其他分支检查到目录包；main 或手动运行额外提供安装包下载。
      - name: 生成双平台测试安装包
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: pnpm exec electron-builder ${{ matrix.package-args }} --publish never
      - name: 保存测试安装包（保留 14 天）
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: 保存失败诊断（保留 7 天）
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostic-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
            dist/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7
